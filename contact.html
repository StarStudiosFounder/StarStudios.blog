<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Star Studios</title>
    <link rel="icon" type="image/png" href="Images/Logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Pantalla de Carga -->
    <div class="loader-wrapper">
        <div class="loader-content">
            <img src="Images/Logo.png" alt="Loading..." class="loader-logo">
        </div>
    </div>

    <nav>
        <div class="nav-main-content">
            <div class="nav-left">
                <img src="Images/Logo.png" alt="Star Studios" class="logo-icon">
                <span class="logo-name">STAR STUDIOS</span>
            </div>
            <ul class="nav-links" id="nav-menu">
                <li><a href="index.html" data-i18n="nav-home">Home</a></li>
                <li><a href="countdown.html" data-i18n="nav-countdown">Countdown</a></li>
                <li><a href="updates.html" data-i18n="nav-updates">Update Log</a></li>
                <li><a href="contact.html" data-i18n="nav-contact" class="active-nav-link">Contact</a></li>
                <li class="mobile-only">
                    <div class="lang-container">
                        <i class="fas fa-globe"></i>
                        <select class="lang-select-field" aria-label="Select Language" title="Select Language">
                            <option value="en">🇺🇸 EN</option>
                            <option value="es">🇪🇸 ES</option>
                            <option value="fr">🇫🇷 FR</option>
                            <option value="de">🇩🇪 DE</option>
                            <option value="it">🇮🇹 IT</option>
                            <option value="ru">🇷🇺 RU</option>
                            <option value="ja">🇯🇵 JA</option>
                            <option value="zh">🇨🇳 ZH</option>
                        </select>
                    </div>
                </li>
            </ul>
        </div>
        <div class="nav-right">
            <div class="lang-container desktop-only">
                <i class="fas fa-globe"></i>
                <select class="lang-select-field" aria-label="Select Language" title="Select Language">
                    <option value="en">🇺🇸 EN</option>
                    <option value="es">🇪🇸 ES</option>
                    <option value="fr">🇫🇷 FR</option>
                    <option value="de">🇩🇪 DE</option>
                    <option value="it">🇮🇹 IT</option>
                    <option value="ru">🇷🇺 RU</option>
                    <option value="ja">🇯🇵 JA</option>
                    <option value="zh">🇨🇳 ZH</option>
                </select>
            </div>
            <button type="button" class="theme-toggle-btn desktop-only" id="theme-toggle" aria-label="Toggle Theme">
                <i class="fas fa-sun"></i>
            </button>
            <button type="button" class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <main class="container contact-container reveal">
        <h1 class="section-title" data-i18n="contact-title">Connect with Us!</h1>
        <p data-i18n="follow-us">Follow our social media for more updates.</p>

        <div class="social-grid">
            <a href="#" class="social-btn twitter"><i class="fab fa-x-twitter"></i> Twitter / X</a>
            <a href="#" class="social-btn tiktok"><i class="fab fa-tiktok"></i> TikTok</a>
            <a href="#" class="social-btn youtube"><i class="fab fa-youtube"></i> YouTube</a>
            <a href="#" class="social-btn discord"><i class="fab fa-discord"></i> Discord</a>
        </div>
        
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> <span data-i18n="back-home">Back to Home</span>
        </a>
    </main>

    <footer class="reveal">
        <img src="Images/Logo.png" alt="Star Studios" class="footer-logo">
        <span data-i18n="copyright">Star Studios - 2026</span>
    </footer>

    <script src="Scripts/translations.js"></script>
    <script src="Scripts/NextUpdateCountdown.js"></script>
</body>
</html>
